# Verificación mínima en cada push y PR: lint, tipos y tests.
# No construye ni despliega (eso lo hace Vercel) y no necesita secretos:
# los tests usan dobles en memoria, nunca la base real.
name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
